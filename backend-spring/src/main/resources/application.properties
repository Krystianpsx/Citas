spring.application.name=citas-medicas

# Mismo puerto que la versión Flask: el frontend (proxy de Vite) funciona sin cambios.
server.port=8000

# ---------- Base de datos ----------
# H2 guardada en el archivo ./datos/citas.mv.db (se crea sola). Para PostgreSQL usa el perfil "postgres".
spring.datasource.url=jdbc:h2:file:./datos/citas
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Aplicación ----------
# Persistencia: "jpa" (base de datos) o "memoria" (no guarda nada al reiniciar).
citas.persistencia=jpa
# Carga médicos, pacientes y citas de demostración si la base está vacía.
citas.datos-de-ejemplo=true
# Orígenes del frontend autorizados por CORS, separados por coma.
citas.origenes-permitidos=http://localhost:5173
# Zona horaria de la clínica (vacío = la del servidor). Ejemplo: America/Bogota
citas.zona-horaria=
